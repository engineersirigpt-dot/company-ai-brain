# P2 pinned reranker — compose (CPU-compatibility, offline runtime)
# WRITE-ONLY — ยังไม่ build/run จน Codex review pinned-build ผ่าน
# runtime target = CPU-compat (smoke/mechanics ทุกเครื่อง) ; CUDA/GPU evidence image = งานแยก
#
# ลำดับ (หลัง review เท่านั้น):
#   1) build ผ่าน wrapper (fail-closed base digest + platform + build manifest):
#        python p2_docker_build.py --py-base python@sha256:<linux/amd64 digest จริง>
#      (wrapper ล็อก --platform linux/amd64, ปฏิเสธ tag ลอย/sentinel, เขียน p2_build_manifest.json + p2_image.id)
#   2) บันทึก image identity (local, ยังไม่ push — RepoDigests จะว่าง จึงห้ามใช้):
#        docker build --iidfile p2_image.id -f Dockerfile.p2 .            # หรือ
#        docker image inspect --format '{{.Id}}' company-ai-brain/p2-reranker:pinned-cpu   # -> sha256:<config digest>
#      -> RunPlan.image_digest (ใช้ local image Id/config digest ; ห้ามใช้ tag :pinned เป็น digest)
#      ถ้า push ไป registry ที่ควบคุมได้ ค่อยใช้ registry content digest แทน
#   3) model-load smoke : docker compose -f docker-compose.p2.yml run --rm reranker python p2_model_smoke.py
#
# ยังไม่มี service ของ real M4 / N-sweep / benchmark ในไฟล์นี้ (NO-GO จน smoke ผ่าน + gates ครบ)

services:
  reranker:
    platform: linux/amd64        # B2: ล็อก platform กัน multi-arch index เลือก child image ต่างเครื่อง
    build:
      context: .
      dockerfile: Dockerfile.p2
      platforms: ["linux/amd64"]
      args:
        # PY_BASE ต้อง inject เป็น digest จริงผ่าน p2_docker_build.py (default = sentinel zeros ที่ pull ไม่ได้)
        MODEL_COMMIT: "953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e"
    image: company-ai-brain/p2-reranker:pinned-cpu   # tag ภายใน; evidence ใช้ image **digest** ไม่ใช่ tag นี้
    environment:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    network_mode: "none"        # runtime ต้อง offline จริง — พิสูจน์ว่าใช้ snapshot จาก cache เท่านั้น
    # ไม่มี command เริ่มอัตโนมัติ (ไม่รัน benchmark) — สั่ง smoke แบบ run --rm เท่านั้น
    profiles: ["manual"]        # กัน `up` เผลอรัน; ต้อง --profile manual หรือ run --rm ตรง service
